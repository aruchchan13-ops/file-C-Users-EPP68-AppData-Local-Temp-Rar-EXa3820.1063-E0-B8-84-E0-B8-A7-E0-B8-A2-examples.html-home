<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#13294B" />
    <meta name="description" content="EyeReady — ติดตามการมองเห็นและเตรียมความพร้อมรับมือ SANS สำหรับนักบินอวกาศ ทำงานออฟไลน์ ไม่ใช่เครื่องมือวินิจฉัย" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>EyeReady</title>
    <script>
      // Apply the saved theme before first paint (no light flash in a dark cabin).
      try {
        var t = JSON.parse(localStorage.getItem('eyeready.theme') || '"system"');
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>EyeReady ต้องใช้ JavaScript</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
