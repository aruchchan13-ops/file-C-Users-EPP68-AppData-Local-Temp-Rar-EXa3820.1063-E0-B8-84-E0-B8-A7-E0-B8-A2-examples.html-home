<title>ครูกระดาน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Sriracha&display=swap">
<link rel="stylesheet" href="app.css">

<header class="top">
  <div class="brand"><span class="logo" data-i18n="appName">ครูกระดาน</span><span class="tag" data-i18n="tagline"></span></div>
  <nav class="modes" role="tablist" data-i18n-aria="modesAria">
    <button class="mode" role="tab" data-mode="topic" aria-selected="true" data-i18n="mode.topic"></button>
    <button class="mode" role="tab" data-mode="homework" aria-selected="false" data-i18n="mode.homework"></button>
    <button class="mode" role="tab" data-mode="exam" aria-selected="false" data-i18n="mode.exam"></button>
    <button class="mode" role="tab" data-mode="chat" aria-selected="false" data-i18n="mode.chat"></button>
  </nav>
  <div class="top-actions">
    <div class="lang-sw" role="group" data-i18n-aria="langAria">
      <button type="button" data-ui-lang="th" aria-pressed="true" lang="th">ไทย</button>
      <button type="button" data-ui-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
    <select class="sel" id="subject" data-i18n-aria="subjectAria"></select>
    <select class="sel" id="level" data-i18n-aria="levelAria"></select>
    <button class="btn" id="newBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newLesson"></span></button>
    <button class="icon-btn" id="histBtn" type="button" data-i18n-aria="history" data-i18n-title="history"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg></button>
    <button class="icon-btn" id="setBtn" type="button" data-i18n-aria="settings" data-i18n-title="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main class="app">
  <section class="board-wrap" data-i18n-aria="boardAria">
    <div class="board-frame">
      <div class="board" id="board">
        <div class="board-inner" id="boardInner">
          <div class="board-head"><span class="lt" id="boardTitle"></span><span id="boardDate"></span></div>
          <div id="boardContent"></div>
          <canvas class="ink-layer" id="ink"></canvas>
        </div>
      </div>
      <div class="board-tools">
        <div class="pen-set" id="penSet" hidden>
          <button class="swatch" type="button" data-pen="k" data-i18n-aria="pen.k" aria-pressed="true" style="background:var(--ink)"></button>
          <button class="swatch" type="button" data-pen="b" data-i18n-aria="pen.b" aria-pressed="false" style="background:var(--ink-b)"></button>
          <button class="swatch" type="button" data-pen="r" data-i18n-aria="pen.r" aria-pressed="false" style="background:var(--ink-r)"></button>
          <button class="swatch" type="button" data-pen="g" data-i18n-aria="pen.g" aria-pressed="false" style="background:var(--ink-g)"></button>
          <button class="tool" type="button" id="eraserBtn" aria-pressed="false" data-i18n-aria="eraser" data-i18n-title="eraser"><svg class="i" viewBox="0 0 24 24"><path d="M7 21h10M5.5 13.5l6-6a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 19H8.5l-3-3a1.8 1.8 0 0 1 0-2.5z"/></svg></button>
          <button class="tool" type="button" id="clearInkBtn" data-i18n-aria="clearInk" data-i18n-title="clearInk"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
          <button class="btn primary" type="button" id="sendInkBtn"><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="checkWork"></span></button>
        </div>
        <button class="tool" type="button" id="penBtn" aria-pressed="false" data-i18n-aria="penTool" data-i18n-title="penTool"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      </div>
    </div>
    <div class="player" id="player">
      <div class="ctrls">
        <button class="icon-btn" id="playBtn" type="button"><svg class="i" viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="icon-btn" id="nextBtn" type="button" data-i18n-aria="next" data-i18n-title="next"><svg class="i" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 5v14"/></svg></button>
        <button class="icon-btn" id="replayBtn" type="button" data-i18n-aria="replay" data-i18n-title="replay"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="icon-btn" id="allBtn" type="button" data-i18n-aria="showAll" data-i18n-title="showAll"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      </div>
      <div class="caption" id="caption" aria-live="polite">
        <div class="who"><span class="speaking-dot"></span><span data-i18n="tutorSays"></span><span id="stepNo"></span></div>
        <div class="say" id="sayText"></div>
      </div>
      <button class="icon-btn" id="voiceBtn" type="button" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" id="voiceIcon"></svg></button>
    </div>
  </section>

  <aside class="panel" data-i18n-aria="panelAria">
    <div class="panel-head"><h2 id="panelTitle"></h2><span class="badge" id="providerBadge"></span></div>
    <div class="feed" id="feed"></div>
    <form class="composer" id="composer">
      <div class="quick" id="quick"></div>
      <div class="exam-opts" id="examOpts" hidden>
        <label for="quizN" data-i18n="quizCount"></label>
        <select class="sel" id="quizN"><option>5</option><option selected>8</option><option>10</option><option>15</option></select>
      </div>
      <div class="atts" id="atts"></div>
      <div class="dict-hint" id="dictHint" hidden></div>
      <div class="status" id="status" hidden><span class="spin"></span><span id="statusText"></span><button class="btn" type="button" id="stopBtn" data-i18n="stop"></button></div>
      <div class="inrow">
        <label class="icon-btn" for="fileIn" id="attachBtn" data-i18n-title="attach" data-i18n-aria="attach"><svg class="i" viewBox="0 0 24 24"><path d="m21 12-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l8-8"/></svg></label>
        <input type="file" id="fileIn" multiple hidden>
        <button class="icon-btn" type="button" id="micBtn" aria-pressed="false" data-i18n-aria="mic" data-i18n-title="mic" hidden><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <textarea id="input" rows="1" data-i18n-aria="inputAria"></textarea>
        <button class="send" id="sendBtn" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-i18n="send"></span></button>
      </div>
    </form>
  </aside>
</main>

<dialog id="setDlg">
  <form class="dlg" method="dialog" id="setForm">
    <h2 data-i18n="settings"></h2>
    <div class="field">
      <label data-i18n="tutorLang"></label>
      <div class="seg">
        <label><input type="radio" name="lang" value="th"><span lang="th">ไทย</span></label>
        <label><input type="radio" name="lang" value="en"><span lang="en">English</span></label>
      </div>
      <small data-i18n="tutorLangHint"></small>
    </div>
    <div class="field">
      <label for="voiceTh" data-i18n="voiceTh"></label>
      <select class="sel" id="voiceTh"></select>
    </div>
    <div class="field">
      <label for="voiceEn" data-i18n="voiceEn"></label>
      <select class="sel" id="voiceEn"></select>
      <small id="voiceHint"></small>
    </div>
    <div class="field">
      <label for="rateIn"><span data-i18n="rate"></span> <span id="rateVal"></span></label>
      <input type="range" id="rateIn" min="0.7" max="1.5" step="0.05">
      <button class="btn" type="button" id="testVoiceBtn" style="align-self:flex-start"><svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><span data-i18n="testVoice"></span></button>
    </div>
    <div class="field">
      <label data-i18n="depth"></label>
      <div class="seg">
        <label><input type="radio" name="tier" value="quick"><span data-i18n="tier.quick"></span></label>
        <label><input type="radio" name="tier" value="default"><span data-i18n="tier.default"></span></label>
        <label><input type="radio" name="tier" value="complex"><span data-i18n="tier.complex"></span></label>
      </div>
      <small data-i18n="depthHint"></small>
    </div>
    <div class="field" id="pwField" hidden>
      <label for="pwIn" data-i18n="password"></label>
      <input type="password" id="pwIn" autocomplete="current-password">
      <small data-i18n="passwordHint"></small>
    </div>
    <div class="dlg-foot"><button class="btn primary" value="ok" data-i18n="done"></button></div>
  </form>
</dialog>

<dialog id="histDlg">
  <div class="dlg">
    <h2 data-i18n="history"></h2>
    <ul class="hist" id="histList"></ul>
    <p class="note" id="histEmpty" data-i18n="histEmpty"></p>
    <div class="dlg-foot"><button class="btn" type="button" id="histClose" data-i18n="close"></button></div>
  </div>
</dialog>

<script type="module" src="app.js"></script>
